<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11101b">
  <meta name="description" content="Una sorpresa de cumpleaños interactiva.">
  <title>Una sorpresa para ti</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene" aria-label="Sorpresa de cumpleaños interactiva">
    <div class="stars" aria-hidden="true"></div>
    <div class="room-glow" aria-hidden="true"></div>
    <div class="cosmos" aria-hidden="true">
      <div class="nebula nebula-one"></div>
      <div class="nebula nebula-two"></div>
      <div class="galaxy galaxy-one"></div>
      <div class="galaxy galaxy-two"></div>
      <div class="starfield starfield-near"></div>
      <div class="starfield starfield-far"></div>
      <div class="portal" aria-hidden="true"><i class="portal-ring portal-ring-outer"></i><i class="portal-ring portal-ring-inner"></i><i class="portal-core"></i></div>
      <svg class="constellation" viewBox="0 0 440 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path class="constellation-line" d="M32 34L83 14L139 28L156 64L121 92L61 136L35 166L162 166M255 18L326 15L382 48L397 108L373 159L307 176L255 148L237 91L255 18" />
        <g class="constellation-stars">
          <circle cx="32" cy="34" r="4"/><circle cx="83" cy="14" r="3"/><circle cx="139" cy="28" r="4"/><circle cx="156" cy="64" r="3"/><circle cx="121" cy="92" r="4"/><circle cx="61" cy="136" r="3"/><circle cx="35" cy="166" r="4"/><circle cx="162" cy="166" r="4"/>
          <circle cx="255" cy="18" r="4"/><circle cx="326" cy="15" r="3"/><circle cx="382" cy="48" r="4"/><circle cx="397" cy="108" r="3"/><circle cx="373" cy="159" r="4"/><circle cx="307" cy="176" r="4"/><circle cx="255" cy="148" r="3"/><circle cx="237" cy="91" r="4"/>
        </g>
      </svg>
    </div>

    <section class="birthday" id="birthday" aria-label="Torta de cumpleaños">
      <div class="cake-wrap" id="cakeWrap">
        <div class="cake" id="cake" role="img" aria-label="Pastel con 20 velas encendidas">
          <div class="candles" id="candles" aria-hidden="true"></div>
          <div class="cake-top"></div>
          <div class="cake-body"><span class="icing icing-top"></span><span class="icing icing-bottom"></span>
            <span class="sprinkles" aria-hidden="true"></span>
          </div>
          <div class="cake-plate"></div>
        </div>
      </div>
      <div class="table" aria-hidden="true"></div>
      <div class="table-front" aria-hidden="true"></div>
    </section>

    <section class="reveal" id="reveal" aria-label="Tu felicitación">
      <div class="memory-card" id="memoryCard">
        <div class="photo-frame">
          <!-- Cambia mi-foto.png por el nombre/ruta de tu foto local. -->
          <img id="memoryPhoto" src="mi-foto.png" alt="Un recuerdo especial">
          <canvas id="photoCanvas" aria-hidden="true"></canvas>
        </div>
      </div>

      <button class="scroll" id="scroll" type="button" aria-expanded="false" aria-controls="letterContent" aria-label="Abrir la carta de cumpleaños">
        <span class="scroll-roll roll-left"></span><span class="scroll-paper"></span><span class="scroll-roll roll-right"></span>
        <span class="ribbon" aria-hidden="true"><i></i><b></b><i></i></span>
        <span class="letter-content" id="letterContent">
          <!-- Edita el mensaje dentro de este contenedor cuando quieras personalizar la carta. -->
          <div class="letter-message" contenteditable="true" aria-label="Mensaje de cumpleaños">
            <p>A mi amiguita la Capi, que la quiero (aunque ya sabe, dice).</p>
            <p>Feliz cumpleaños. Aunque no te conozco mucho tiempo, me caes bien.</p>
            <p>Haces que las noches aburridas se vuelvan más divertidas, aunque te duermas muy temprano y no contestes mensaje :( xd</p>
            <p>Hoy (bueno, mañana) un año más de vieja xdd. Bromita uu.</p>
            <p>Y aquí estoy para apoyarte en las locuras o cosas que hagas, si es que no decides eliminar la cuenta como el Humitas xd.</p>
            <p>Y cuando leas esto ya te habré mandado tu galaxia. O tal vez no, no hay economía.</p>
            <p>Ojalá cumplas tus metas y seas una gran persona y profesional.</p>
            <p>Un abrazo virtual desde Perú.</p>
            <p>Te manda tu amigo, Fabri.</p>
          </div>
        </span>
      </button>
    </section>

    <div class="wind" id="wind" aria-hidden="true"></div>
    <div class="darkness" id="darkness" aria-hidden="true"></div>
    <div class="shooting-star" aria-hidden="true"><i></i></div>
    <div class="heartbeat" aria-hidden="true"></div>
    <div class="celebration" id="celebration" aria-hidden="true"></div>
    <button class="replay" id="replay" type="button" aria-label="Repetir la sorpresa" title="Repetir">↻</button>
  </main>

  <!-- Opcional: coloca estos MP3 junto al HTML o cambia las rutas. Sin archivos, hay un sonido Web Audio de respaldo. -->
  <audio id="windAudio" src="viento.mp3" preload="none"></audio>
  <audio id="hoverAudio" src="hover.mp3" preload="none"></audio>
  <audio id="paperAudio" src="carta.mp3" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
